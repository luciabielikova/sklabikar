<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sklabikár</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style type="text/tailwindcss">
@theme {
  --color-brand-green: #06D6A0;
  --color-brand-blue: #118AB2;
  --color-brand-pink: #EF476F;
  --color-brand-purple: #8338EC;
  --color-brand-orange: #FF9F1C;
  --color-brand-yellow: #FFD166;
}
</style>
<style>
body{font-family:ui-rounded,'Arial Rounded MT Bold','Segoe UI',system-ui,Arial,sans-serif;background:#F7F9FC;touch-action:manipulation}
.tile{font-weight:700}
.chip{touch-action:none;transition:transform .15s}.chip:hover{transform:scale(1.06)}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .45s}
.animate-wiggle{animation:wiggle .4s ease-in-out infinite}
.drag-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.9;transform:translate(-50%,-50%) scale(1.1)}
.slot.over{border-color:#06D6A0;background:#E6FFFA}
button:focus-visible,input:focus-visible{outline:3px solid #8338EC;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">
<header class="bg-white border-b-4 border-brand-yellow sticky top-0 z-40 px-3 py-2.5 shadow-md">
 <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
  <h1 class="text-2xl sm:text-3xl font-bold text-brand-purple">Sklabikár</h1>
  <nav class="flex items-center bg-slate-100 p-1 rounded-2xl border-2 border-slate-200 gap-1">
   <button id="nav-1" onclick="setLevel(1)">1 Počítam hlásky</button>
   <button id="nav-2" onclick="setLevel(2)">2 Červené a modré</button>
   <button id="nav-3" onclick="setLevel(3)">3 Písmenká</button>
   <button id="nav-0" onclick="setLevel(0)" aria-label="Nastavenia pre učiteľku">⚙ Učiteľka</button>
  </nav>
 </div>
</header>

<main class="max-w-4xl w-full mx-auto p-3 sm:p-6 flex-grow">
 <div id="game" class="bg-white rounded-3xl border-4 border-slate-200 p-4 sm:p-8 shadow-xl flex flex-col items-center gap-4">
  <p id="instr" class="text-slate-600 font-semibold text-center text-base sm:text-lg"></p>
  <button id="hardBtn" onclick="toggleHard()" class="text-sm font-semibold px-4 py-1.5 rounded-xl border-2 border-slate-300 bg-white text-slate-600"></button>
  <div id="empty" class="hidden text-center py-8">
   <p class="text-lg font-bold mb-3">Pre vybrané písmenká zatiaľ nemáme slovo.</p>
   <button onclick="setLevel(0)" class="bg-brand-orange text-white px-6 py-3 rounded-2xl font-bold border-b-4 border-amber-700">Vybrať písmenká</button>
  </div>
  <div id="work" class="w-full flex flex-col items-center gap-4">
   <div class="relative">
    <div class="w-40 h-40 sm:w-52 sm:h-52 bg-gradient-to-br from-blue-50 to-amber-50 rounded-3xl border-4 border-brand-yellow flex items-center justify-center"><div id="pic" class="w-full h-full flex items-center justify-center p-2"></div></div>
    <button onclick="sayWord()" aria-label="Prečítaj slovo" class="absolute -bottom-2 -right-2 bg-brand-green text-white w-14 h-14 rounded-full border-4 border-white shadow-lg text-2xl">🔊</button>
   </div>
   <div id="wordText" class="tile text-3xl sm:text-4xl text-brand-purple min-h-[44px] tracking-wider"></div>
   <div id="line"></div>
   <div class="w-full max-w-xl bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-3">
    <p class="text-sm text-slate-400 font-semibold text-center mb-2">Zásobník</p>
    <div id="pile" class="flex flex-wrap justify-center gap-2 min-h-[56px]"></div>
   </div>
   <div class="flex gap-3"><button id="playBtn" onclick="playBuilt()" class="bg-brand-blue text-white px-6 py-3 rounded-2xl font-bold text-lg border-b-4 border-blue-800">▶ Prehrať</button><button id="doneBtn" onclick="check()" class="bg-brand-green text-white px-8 py-3 rounded-2xl font-bold text-lg border-b-4 border-emerald-800">Hotovo</button></div>
   <div class="w-full flex justify-between items-center pt-4 border-t border-slate-100">
    <button onclick="step(-1)" class="bg-slate-100 text-slate-700 px-5 py-3 rounded-2xl font-bold border-b-4 border-slate-300">← Späť</button>
    <span id="counter" class="text-slate-500 font-semibold"></span>
    <button onclick="step(1)" class="bg-brand-pink text-white px-6 py-3 rounded-2xl font-bold border-b-4 border-rose-800">Ďalšie →</button>
   </div>
  </div>
 </div>

 <div id="settings" class="hidden bg-white rounded-3xl border-4 border-slate-200 p-5 sm:p-8 shadow-xl flex flex-col gap-5">
  <div class="text-center"><h2 class="text-2xl sm:text-3xl font-bold">Písmenká pre 3. úroveň</h2>
   <p class="text-sm text-slate-500 mt-1">Označ písmenká, ktoré trieda už pozná. V 3. úrovni sa objavia len slová zložené z nich. Úrovne 1 a 2 používajú všetky slová.</p></div>
  <div class="flex flex-wrap justify-center gap-2">
   <button onclick="preset(BASIC)" class="bg-brand-blue text-white px-4 py-2 rounded-xl font-semibold border-b-4 border-blue-800">Základné</button>
   <button onclick="preset(LETTERS)" class="bg-brand-green text-white px-4 py-2 rounded-xl font-semibold border-b-4 border-emerald-800">Všetky</button>
   <button onclick="preset([])" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-semibold border-b-4 border-slate-300">Žiadne</button>
  </div>
  <div id="grid" class="grid grid-cols-4 sm:grid-cols-7 md:grid-cols-9 gap-2"></div>
  <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-slate-100">
   <span class="text-sm font-semibold text-slate-500">Označených: <strong id="cnt" class="text-brand-purple"></strong>. Uloží sa v tomto prehliadači.</span>
   <button onclick="setLevel(3)" class="bg-brand-pink text-white px-8 py-3 rounded-2xl font-bold border-b-4 border-rose-800">Uložiť a hrať</button>
  </div>
 </div>
</main>
<div id="toast" role="status" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-white px-5 py-3 rounded-2xl font-semibold shadow-xl"></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const LETTERS=['A','Á','Ä','B','C','Č','D','Ď','E','É','F','G','H','CH','I','Í','J','K','L','Ĺ','Ľ','M','N','Ň','O','Ó','Ô','P','Q','R','Ŕ','S','Š','T','Ť','U','Ú','V','W','X','Y','Ý','Z','Ž'];
const BASIC=['A','E','I','O','U','M','P','S','L','V','T','J','R','D','K','B','C','CH'];
const VOW=new Set(['A','Á','Ä','E','É','I','Í','O','Ó','Ô','U','Ú','Y','Ý']);
const FILEMAP={'Á':'a_dlzen','Ä':'a_dve_bodky','Č':'c_makke','Ď':'d_makke','É':'e_dlzen','Í':'i_dlzen','Ĺ':'l_dlzen','Ľ':'l_makke','Ň':'n_makke','Ó':'o_dlzen','Ô':'o_strieska','Ŕ':'r_dlzen','Š':'s_makke','Ť':'t_makke','Ú':'u_dlzen','Ý':'y_dlzen','Ž':'z_makke'};
const SOUND={M:'mmm',N:'nnn',S:'sss',Š:'šš',Z:'zzz',Ž:'žž',F:'fff',L:'lll',R:'rrr',V:'vvv',H:'hhh',CH:'chch'};
const FALLBACK='BABKA 👵|BALÓN 🎈|VRANA 🐦‍⬛|ŠARKAN 🪁|LOPTA ⚽|MEDVEĎ 🧸|KAČKA 🦆|CHATA 🛖|PES 🐶|LES 🌲|MISA 🥣|MAMA 👩|DOM 🏠|AUTO 🚗|SOVA 🦉|RYBA 🐟|STROM 🌳|SLNKO ☀️|JABLKO 🍎|VLAK 🚆|ŽABA 🐸|ŠKOLA 🏫|KÔŇ 🐴|ĽAD 🧊|ŤAVA 🐪|KVET 🌸|HUBA 🍄|MÄSO 🥩|SÝR 🧀|KNIHA 📖|ČAJ 🍵'
 .split('|').map(s=>{const i=s.indexOf(' ');return{word:s.slice(0,i),emoji:s.slice(i+1)}});

let WORDS=FALLBACK,hard=store.get('sklabikar_hard')==='1',level=1,idx=0,words=[],pile=[],line=[],done=false,busy=false,known=new Set(BASIC);
const tokens=w=>{const u=w.toUpperCase(),t=[];for(let i=0;i<u.length;){const p=u.substr(i,2);if(['CH','DZ','DŽ'].includes(p)){t.push(p);i+=2}else t.push(u[i++])}return t};
const typeOf=c=>VOW.has(c)?'v':'c';
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),2500)};

/* ---------- Zvuk ---------- */
let voice=null;const synth=window.speechSynthesis;
const pickVoice=()=>{if(!synth)return;const v=synth.getVoices();voice=v.find(x=>/^sk/i.test(x.lang))||v.find(x=>/^cs/i.test(x.lang))||null};
pickVoice();if(synth)synth.onvoiceschanged=pickVoice;
function tts(text,rate=.85){if(!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang='sk-SK';u.rate=rate;u.pitch=1.15;synth.speak(u)}
// Najprv skúsi nahrávku, ak chýba, povie text syntézou reči
function say(path,text,rate){new Audio(path).play().catch(()=>tts(text,rate))}
const ascii=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const sayWord=()=>{const w=words[idx];if(w)say(`assets/audio/words/${ascii(w.word)}.m4a`,w.word.toLowerCase())};
const sayLetter=c=>say(`assets/audio/letters/${FILEMAP[c]||c.toLowerCase()}.m4a`,SOUND[c]||c.toLowerCase(),.75);
function fx(ok){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.connect(g);g.connect(c.destination);
 if(ok){o.type='triangle';[523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.1))}else{o.type='sawtooth';o.frequency.setValueAtTime(240,t);o.frequency.setValueAtTime(160,t+.15)}
 g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.01,t+.4);o.start();o.stop(t+.4)}catch(e){}}

/* ---------- Úrovne ---------- */
const NAVB='px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-xl font-semibold text-sm sm:text-base transition-all ';
const NAVC=['bg-brand-orange text-white shadow-md','bg-brand-blue text-white shadow-md','bg-brand-pink text-white shadow-md','bg-brand-green text-white shadow-md'];
const INSTR={1:'Klikni na štvorček a počúvaj hlásku. Ťahaj štvorčeky na čiaru v poradí, ako ide slovo.',2:'Červený kruh je samohláska, modrý štvorček spoluhláska. Klikni, počúvaj a ťahaj ich na čiaru v správnom poradí.',3:'Poskladaj slovo. Každé písmenko ide na svoje miesto.'};
function setLevel(n){
 level=n;idx=0;
 [1,2,3,0].forEach((k,i)=>{$('nav-'+k).className=NAVB+(k===n?NAVC[k===0?0:k]:'text-slate-600')});
 $('game').classList.toggle('hidden',n===0);$('settings').classList.toggle('hidden',n!==0);
 if(n===0){renderGrid();return}
 store.set('sklabikar_level',n);
 $('instr').textContent=INSTR[n];updateButtons();
 filter();setup();
}
function updateButtons(){
 $('doneBtn').classList.toggle('hidden',level===3||!hard);
 $('hardBtn').textContent=hard?'Ťažký režim: zapnutý (pribudnú kúsky navyše)':'Ťažký režim: vypnutý';
}
function toggleHard(){hard=!hard;store.set('sklabikar_hard',hard?'1':'0');updateButtons();setup()}
function filter(){words=WORDS.filter(w=>{const t=tokens(w.word);return t.length<=8&&(level<3||t.every(c=>known.has(c)))});if(idx>=words.length)idx=0}
function step(d){if(!words.length)return;idx=(idx+d+words.length)%words.length;setup()}

function setup(){
 const none=!words.length;$('empty').classList.toggle('hidden',!none);$('work').classList.toggle('hidden',none);
 if(none)return;
 const t=tokens(words[idx].word);done=false;busy=false;
 const extra=hard?[...new Set([...known,...BASIC])].filter(c=>!t.includes(c)).sort(()=>Math.random()-.5).slice(0,2):[];
 pile=[...t,...extra].sort(()=>Math.random()-.5).map((c,i)=>({id:i,char:c,type:typeOf(c)}));
 line=level===3?new Array(t.length).fill(null):[];
 render();
}

function chipEl(c,bad,onclick){
 const e=document.createElement('div');
 e.className=`tile chip ${level>1&&c.type==='v'?'rounded-full':'rounded-xl'} ${bad?'bg-red-500 shake':level>1&&c.type==='v'?'bg-brand-pink':'bg-brand-blue'} w-12 h-12 sm:w-16 sm:h-16 text-white flex items-center justify-center text-2xl sm:text-3xl shadow-md cursor-pointer select-none`;
 if(level===3)e.textContent=c.char;
 if(onclick)e.onclick=onclick;
 return e;
}
function render(bad=[]){
 const w=words[idx],t=tokens(w.word),L=$('line');
 const pic=$('pic'),fb=()=>{pic.innerHTML=w.emoji?`<div style="font-size:6.5rem;line-height:1" role="img" aria-label="${w.word}">${w.emoji}</div>`:'<div class="text-6xl">❓</div>'};
 pic.innerHTML='';
 if(w.image){const im=new Image();im.alt=w.word;im.className='max-w-full max-h-full object-contain';im.onerror=fb;im.src=w.image;pic.appendChild(im)}else fb();
 $('counter').textContent=`${idx+1} / ${words.length}`;
 $('wordText').textContent=done?w.word:'';
 L.innerHTML='';L.style.borderColor='';L.classList.remove('shake');
 if(level<3){
  L.className='flex flex-wrap gap-2 items-end min-h-[76px] w-full max-w-xl border-b-8 border-slate-500 px-2 pb-1';
  line.forEach((c,i)=>{const e=chipEl(c,bad.includes(i));drag(e,c,'line');L.appendChild(e)});
 }else{
  L.className='flex flex-wrap justify-center gap-2 min-h-[76px]';
  t.forEach((_,i)=>{const s=document.createElement('div');
   s.className='slot w-14 h-14 sm:w-[4.5rem] sm:h-[4.5rem] rounded-xl border-4 border-dashed border-slate-300 bg-slate-100 flex items-center justify-center';
   if(line[i]){const e=chipEl(line[i],bad.includes(i));drag(e,line[i],'line');s.appendChild(e)}L.appendChild(s)});
 }
 const P=$('pile');P.innerHTML='';
 pile.forEach(c=>{const e=chipEl(c);drag(e,c,'pile');P.appendChild(e)});
}

/* ---------- Presúvanie ---------- */
function slotAt(x,y){const s=document.querySelectorAll('.slot');for(let i=0;i<s.length;i++){const r=s[i].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return i}return null}
function overLine(x,y){const r=$('line').getBoundingClientRect();return x>=r.left-20&&x<=r.right+20&&y>=r.top-50&&y<=r.bottom+30}
function drag(el,chip,src){
 let sx=0,sy=0,moving=false,ghost=null;
 const move=e=>{
  if(!moving&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){moving=true;sayLetter(chip.char);ghost=el.cloneNode(true);ghost.classList.add('drag-ghost');document.body.appendChild(ghost);el.style.opacity='.3'}
  if(moving){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.querySelectorAll('.slot').forEach(s=>s.classList.remove('over'));const i=slotAt(e.clientX,e.clientY);if(i!==null)document.querySelectorAll('.slot')[i].classList.add('over')}
 };
 const up=e=>{
  el.releasePointerCapture(e.pointerId);['pointermove','pointerup','pointercancel'].forEach(n=>el.removeEventListener(n,n==='pointermove'?move:up));
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('over'));
  if(ghost){ghost.remove();ghost=null}el.style.opacity='1';
  if(e.type==='pointercancel')return;
  if(!moving){tap(chip,src);return}
  if(level===3){const i=slotAt(e.clientX,e.clientY);if(i!==null)place(chip,i);else if(src==='line')back(chip)}
  else if(overLine(e.clientX,e.clientY))place(chip,insertAt(e.clientX,e.clientY,el));
  else if(src==='line')back(chip);
 };
 el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moving=false;el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
}
// Klik alebo začiatok ťahania povie hlásku kúska. Úroveň 1-2 sa presúva ťahaním, úroveň 3 aj klikom z kopky.
function tap(chip,src){
 sayLetter(chip.char);
 if(level===3&&src==='pile')place(chip,line.indexOf(null));
}
// Kam do čiary patrí pustený kúsok (podľa riadku a vodorovnej polohy)
function insertAt(x,y,skip){
 const cs=[...$('line').children].filter(c=>c!==skip).map(c=>c.getBoundingClientRect());
 if(!cs.length)return 0;
 const b=cs.reduce((a,c)=>Math.abs(y-(a.top+a.height/2))<=Math.abs(y-(c.top+c.height/2))?a:c);
 return cs.filter(r=>r.top<b.top-5||(Math.abs(r.top-b.top)<=5&&r.left+r.width/2<x)).length;
}
// Prečíta, čo je zatiaľ poskladané (napr. SO zo slova SOVA)
function playBuilt(){
 const w=words[idx],a=line.filter(Boolean).map(c=>c.char);
 if(!a.length){toast('Najprv polož kúsok na čiaru.');return}
 const str=a.join('');
 if(str===w.word)sayWord();else if(a.length===1)sayLetter(a[0]);else tts(str.toLowerCase(),.7);
}
// Vlastné slová: assets/words.json (zoznam reťazcov alebo objektov), inak ostane vstavaný zoznam
async function loadCustomWords(){
 try{
  const r=await fetch('assets/words.json',{cache:'no-cache'});if(!r.ok)return;
  const arr=await r.json();if(!Array.isArray(arr))return;
  const ok=arr.map(x=>typeof x==='string'?{word:x}:x)
   .filter(x=>x&&typeof x.word==='string'&&/^[A-ZÁÄČĎÉÍĹĽŇÓÔŔŠŤÚÝŽ]+$/i.test(x.word.trim()))
   .map(x=>{const w=x.word.trim().toUpperCase();return{word:w,emoji:x.emoji,image:x.image||`assets/images/${ascii(w)}.png`}});
  if(ok.length)WORDS=ok;
 }catch(e){}
}
function place(chip,i){
 done=false;
 if(level<3){
  const from=line.indexOf(chip);
  if(from<0&&line.length>=10)return;
  if(from>=0)line.splice(from,1);else pile=pile.filter(c=>c!==chip);
  line.splice(i<0?line.length:Math.min(i,line.length),0,chip);
 }else{
  if(i<0)return;
  const from=line.indexOf(chip),old=line[i];
  if(old===chip)return;
  if(from>=0)line[from]=old||null;else{pile=pile.filter(c=>c!==chip);if(old)pile.push(old)}
  line[i]=chip;
 }
 render();
 if((level===3&&line.every(Boolean))||(level<3&&!hard&&!pile.length))check();
}
function back(chip){
 const i=line.indexOf(chip);if(i<0)return;done=false;
 if(level<3)line.splice(i,1);else line[i]=null;
 pile.push(chip);pile.sort((a,b)=>a.id-b.id);render();
}

/* ---------- Kontrola ---------- */
function check(){
 if(!words.length)return;
 const w=words[idx],t=tokens(w.word),bad=[];
 if(!line.length){toast('Najprv polož štvorčeky na čiaru.');return}
 if(level===3&&!line.every(Boolean)){toast('Najprv doplň všetky miesta.');return}
 line.forEach((c,i)=>{if(c&&c.char!==t[i])bad.push(i)});
 if(!bad.length&&line.length!==t.length)bad.push(-1);
 if(!bad.length){
  done=true;fx(true);setTimeout(sayWord,300);render();
  if(typeof confetti==='function')confetti({particleCount:120,spread:80,origin:{y:.6}});
  return;
 }
 render(bad);
 if(bad.includes(-1)){const L=$('line');L.style.borderColor='#ef4444';L.classList.add('shake')}
}

/* ---------- Nastavenia pre učiteľku ---------- */
function renderGrid(){
 const g=$('grid');g.innerHTML='';
 LETTERS.forEach(l=>{
  const on=known.has(l),b=document.createElement('button');
  b.className=`tile p-3 rounded-2xl text-xl sm:text-2xl border-b-4 ${on?'bg-brand-green text-white border-emerald-700':'bg-slate-100 text-slate-500 border-slate-300'}`;
  b.textContent=l;b.setAttribute('aria-pressed',on);
  b.onclick=()=>{if(known.has(l))known.delete(l);else{known.add(l);sayLetter(l)}save();renderGrid()};
  g.appendChild(b);
 });
 $('cnt').textContent=known.size;
}
function save(){store.set('sklabikar_letters',JSON.stringify([...known]))}
function preset(a){known=new Set(a);save();renderGrid()}

/* ---------- Štart ---------- */
(function(){
 let saved=null;try{saved=JSON.parse(store.get('sklabikar_letters'))}catch(e){}
 if(Array.isArray(saved))known=new Set(saved);
 // Predvolené písmená pre celú triedu: súbor config.json vedľa index.html, napr. {"letters":["A","E","M"]}
 if(!saved)fetch('config.json').then(r=>r.json()).then(c=>{if(Array.isArray(c.letters)){known=new Set(c.letters);if(level===3){filter();setup()}}}).catch(()=>{});
 const l=parseInt(store.get('sklabikar_level'));loadCustomWords().then(()=>setLevel([1,2,3].includes(l)?l:1));
})();
</script>
</body>
</html>
